    // --- OTHER HELPERS ---

    function escapeHtml(text) {
      if (!text) return '';
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    function getRelativeTime(timestamp) {
      const diffMs = Date.now() - timestamp;
      const diffSec = Math.floor(diffMs / 1000);
      const diffMin = Math.floor(diffSec / 60);
      const diffHrs = Math.floor(diffMin / 60);
      const diffDays = Math.floor(diffHrs / 24);

      if (diffSec < 10) {
        return 'just now';
      } else if (diffSec < 60) {
        return `${diffSec} seconds ago`;
      } else if (diffMin === 1) {
        return 'about a minute ago';
      } else if (diffMin < 60) {
        return `${diffMin} minutes ago`;
      } else if (diffHrs === 1) {
        return 'about an hour ago';
      } else if (diffHrs < 24) {
        return `about ${diffHrs} hours ago`;
      } else if (diffDays === 1) {
        return 'yesterday';
      } else {
        const date = new Date(timestamp);
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        return `${months[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}`;
      }
    }
    // --- AUTOCOMPLETE & FRAME REFERENCES HELPERS ---

    function handleAutocompleteSearch(query = '') {
      if (!autocompleteActive) return;
      
      const cleanQuery = query.toLowerCase().trim();
      filteredFrames = allFrames.filter(f => f.name.toLowerCase().includes(cleanQuery));

      if (filteredFrames.length === 0) {
        autocompleteDropdown.style.display = 'none';
        return;
      }

      // Cap results list
      filteredFrames = filteredFrames.slice(0, 15);
      renderAutocompleteList();
      
      try {
        const selection = window.getSelection();
        if (selection.rangeCount) {
          const range = selection.getRangeAt(0).cloneRange();
          range.setStart(autocompleteNode, autocompleteOffset);
          range.setEnd(autocompleteNode, autocompleteOffset + 1);
          
          let rect = range.getBoundingClientRect();
          if (rect.width === 0 && rect.height === 0) {
            const span = document.createElement('span');
            span.textContent = '\u200b';
            range.insertNode(span);
            rect = span.getBoundingClientRect();
            span.parentNode.removeChild(span);
          }
          
          const editorRect = editor.getBoundingClientRect();
          const x = rect.left - editorRect.left + editor.scrollLeft;
          const y = rect.bottom - editorRect.top + editor.scrollTop + 4;
          
          autocompleteDropdown.style.left = `${Math.min(x, editor.clientWidth - 210)}px`;
          autocompleteDropdown.style.top = `${y}px`;
          autocompleteDropdown.style.display = 'flex';
        }
      } catch (err) {
        console.error("Error positioning autocomplete:", err);
      }
    }

    function renderAutocompleteList() {
      autocompleteDropdown.innerHTML = '';
      filteredFrames.forEach((frame, idx) => {
        const btn = document.createElement('button');
        btn.className = `autocomplete-item ${idx === selectedAutocompleteIndex ? 'selected' : ''}`;
        btn.innerHTML = `🖼️ ${escapeHtml(frame.name)}`;
        btn.onclick = (e) => {
          e.stopPropagation();
          insertAutocompleteFrame(frame.name);
        };
        if (idx === selectedAutocompleteIndex) {
          setTimeout(() => btn.scrollIntoView({ block: 'nearest' }), 0);
        }
        autocompleteDropdown.appendChild(btn);
      });
    }

    function insertAutocompleteFrame(frameName) {
      if (!autocompleteActive || !autocompleteNode) return;
      
      const selection = window.getSelection();
      if (!selection.rangeCount) return;
      
      const range = selection.getRangeAt(0);
      range.setStart(autocompleteNode, autocompleteOffset);
      range.setEnd(autocompleteNode, selection.focusOffset);
      
      const frame = allFrames.find(f => f.name === frameName);
      const url = frame ? frame.url : `figma://node-id=${encodeURIComponent(frameName)}`;
      
      const link = document.createElement('a');
      link.href = '#';
      link.className = 'frame-link';
      link.textContent = frameName;
      link.setAttribute('onclick', `jumpToFrameDirect('${frame ? frame.id : frameName}', event)`);
      link.dataset.nodeId = frame ? frame.id : frameName;
      link.dataset.url = url;
      
      range.deleteContents();
      range.insertNode(link);
      
      range.setStartAfter(link);
      range.collapse(true);
      selection.removeAllRanges();
      selection.addRange(range);
      
      closeAutocomplete();
      handleEditorInput();
    }

    function closeAutocomplete() {
      autocompleteActive = false;
      autocompleteNode = null;
      autocompleteDropdown.style.display = 'none';
    }

    function parseLinkedFrames() {
      const linkedFramesContainer = document.getElementById('linkedFramesContainer');
      const linkedFramesHeader = document.getElementById('linkedFramesHeader');
      
      if (!linkedFramesContainer || !linkedFramesHeader) return;
      linkedFramesContainer.innerHTML = '';
      
      const referencedItems = [];
      const links = editor.querySelectorAll('a');
      links.forEach(link => {
        const nodeId = link.dataset.nodeId || getFigmaNodeIdFromUrl(link.getAttribute('href') || '');
        const name = link.textContent.trim();
        const url = link.dataset.url || link.getAttribute('href') || '';
        
        if (nodeId && name && url && !referencedItems.some(item => item.nodeId === nodeId)) {
          referencedItems.push({ name, url, nodeId });
        }
      });

      if (referencedItems.length === 0) {
        linkedFramesHeader.style.display = 'none';
        return;
      }

      let count = 0;
      referencedItems.forEach(item => {
        count++;
        const btn = document.createElement('button');
        btn.className = 'popover-item';
        btn.style.paddingLeft = '12px';
        btn.innerHTML = `
          <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">📍 ${escapeHtml(item.name)}</span>
          <span class="popover-shortcut">Jump</span>
        `;
        btn.onclick = (e) => {
          e.stopPropagation();
          parent.postMessage({ pluginMessage: { type: 'goToFrame', nodeId: item.nodeId } }, '*');
        };
        linkedFramesContainer.appendChild(btn);
      });

      if (count > 0) {
        linkedFramesHeader.style.display = 'block';
      } else {
        linkedFramesHeader.style.display = 'none';
      }
    }

    // Capture keyboard events in contenteditable
    editor.addEventListener('keydown', (e) => {
      const isMeta = e.metaKey || e.ctrlKey;
      
      // Auto-save on shortcut triggers
      if (isMeta && (e.key === 'b' || e.key === 'i' || e.key === 'u')) {
        setTimeout(handleEditorInput, 10);
      }

      if (!autocompleteActive) return;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        selectedAutocompleteIndex = (selectedAutocompleteIndex + 1) % filteredFrames.length;
        renderAutocompleteList();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        selectedAutocompleteIndex = (selectedAutocompleteIndex - 1 + filteredFrames.length) % filteredFrames.length;
        renderAutocompleteList();
      } else if (e.key === 'Enter' || e.key === 'Tab') {
        e.preventDefault();
        if (filteredFrames[selectedAutocompleteIndex]) {
          insertAutocompleteFrame(filteredFrames[selectedAutocompleteIndex].name);
        }
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeAutocomplete();
      }
    });

    editor.addEventListener('keyup', (e) => {
      if (!autocompleteActive && (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        checkLinkClick();
        return;
      }

      const selection = window.getSelection();
      if (!selection.rangeCount) return;

      const range = selection.getRangeAt(0);
      const container = range.startContainer;

      if (container.nodeType === Node.TEXT_NODE) {
        const text = container.textContent;
        const caretOffset = range.startOffset;
        const textBeforeCaret = text.substring(0, caretOffset);

        // Find triggers
        const lastAt = textBeforeCaret.lastIndexOf('@');
        const lastSlash = textBeforeCaret.lastIndexOf('/');

        let triggerIdx = -1;
        let triggerChar = '';

        if (lastAt !== -1 && (lastSlash === -1 || lastAt > lastSlash)) {
          triggerIdx = lastAt;
          triggerChar = '@';
        } else if (lastSlash !== -1 && (lastAt === -1 || lastSlash > lastAt)) {
          triggerIdx = lastSlash;
          triggerChar = '/';
        }

        if (triggerIdx !== -1) {
          const charBeforeTrigger = triggerIdx > 0 ? textBeforeCaret.charAt(triggerIdx - 1) : ' ';
          if ([' ', '\n', '\u00A0', '\u200b'].includes(charBeforeTrigger)) {
            autocompleteActive = true;
            autocompleteTriggerChar = triggerChar;
            autocompleteNode = container;
            autocompleteOffset = triggerIdx;

            const query = textBeforeCaret.substring(triggerIdx + 1);
            if (!query.includes('\n')) {
              handleAutocompleteSearch(query);
              return;
            }
          }
        }
      }

      closeAutocomplete();
      checkLinkClick();
    });

    editor.addEventListener('click', () => {
      closeAutocomplete();
      checkLinkClick();
    });

    editor.addEventListener('scroll', () => {
      checkLinkClick();
    });

    // Formatting insertion handler
    function applyFormat(type) {
      if (type === 'bold') {
        document.execCommand('bold', false, null);
      } else if (type === 'italic') {
        document.execCommand('italic', false, null);
      } else if (type === 'underline') {
        document.execCommand('underline', false, null);
      } else if (type === 'strikethrough') {
        document.execCommand('strikeThrough', false, null);
      } else if (type === 'code') {
        const selection = window.getSelection();
        if (selection.rangeCount) {
          const range = selection.getRangeAt(0);
          const selectedText = range.toString();
          
          const codeNode = document.createElement('code');
          codeNode.textContent = selectedText || 'code';
          
          range.deleteContents();
          range.insertNode(codeNode);
          
          range.setStartAfter(codeNode);
          range.collapse(true);
          selection.removeAllRanges();
          selection.addRange(range);
        }
      } else if (type === 'link') {
        const selection = window.getSelection();
        if (selection.rangeCount) {
          const range = selection.getRangeAt(0).cloneRange();
          
          // Check if selection is inside an existing link
          let parentLink = null;
          let node = range.commonAncestorContainer;
          while (node && node !== editor) {
            if (node.nodeType === Node.ELEMENT_NODE && node.tagName.toLowerCase() === 'a') {
              parentLink = node;
              break;
            }
            node = node.parentNode;
          }
          
          let urlPrompt = 'https://';
          let defaultText = '';
          
          if (parentLink) {
            urlPrompt = parentLink.getAttribute('data-url') || parentLink.getAttribute('href') || parentLink.href;
            defaultText = parentLink.textContent;
          } else {
            defaultText = range.toString();
            if (defaultText.startsWith('http')) {
              urlPrompt = defaultText;
            }
          }
          
          const url = prompt('Enter URL (leave empty to remove link):', urlPrompt);
          if (url === null) return; // User clicked Cancel
          
          // Restore the selection
          selection.removeAllRanges();
          selection.addRange(range);
          
          if (parentLink) {
            if (url.trim() === '') {
              // Remove the link (unwrap)
              const textNode = document.createTextNode(parentLink.textContent);
              parentLink.parentNode.replaceChild(textNode, parentLink);
            } else {
              // Update existing link
              const targetUrl = url.trim();
              parentLink.setAttribute('href', targetUrl);
              parentLink.dataset.url = targetUrl;
              
              // If it's a figma node link, set class/nodeId
              if (targetUrl.startsWith('figma://node-id=') || targetUrl.includes('node-id=')) {
                parentLink.className = 'frame-link';
                const nodeId = getFigmaNodeIdFromUrl(targetUrl);
                if (nodeId) {
                  parentLink.dataset.nodeId = nodeId;
                  parentLink.setAttribute('onclick', `jumpToFrameDirect('${nodeId}', event)`);
                }
              } else {
                parentLink.className = '';
                parentLink.removeAttribute('onclick');
                parentLink.removeAttribute('data-node-id');
                parentLink.target = '_blank';
              }
            }
          } else {
            // Create a new link
            if (url.trim() === '') return;
            const targetUrl = url.trim();
            
            const link = document.createElement('a');
            link.href = targetUrl;
            link.dataset.url = targetUrl;
            link.textContent = defaultText || 'Link';
            
            if (targetUrl.startsWith('figma://node-id=') || targetUrl.includes('node-id=')) {
              link.className = 'frame-link';
              const nodeId = getFigmaNodeIdFromUrl(targetUrl);
              if (nodeId) {
                link.dataset.nodeId = nodeId;
                link.setAttribute('onclick', `jumpToFrameDirect('${nodeId}', event)`);
              }
            } else {
              link.target = '_blank';
            }
            
            range.deleteContents();
            range.insertNode(link);
            
            // Move cursor after the link
            const newRange = document.createRange();
            newRange.setStartAfter(link);
            newRange.collapse(true);
            selection.removeAllRanges();
            selection.addRange(newRange);
          }
        }
      } else if (type === 'bullet') {
        document.execCommand('insertUnorderedList', false, null);
      } else if (type === 'number') {
        document.execCommand('insertOrderedList', false, null);
      } else if (type === 'checkbox') {
        const checkboxHtml = `<ul class="checklist-container"><li class="checklist-item"><input type="checkbox"> <span>Checklist item</span></li></ul>`;
        document.execCommand('insertHTML', false, checkboxHtml);
      } else if (type === 'quote') {
        document.execCommand('formatBlock', false, 'blockquote');
      } else if (type === 'table') {
        toggleTableWizard();
      } else if (type === 'h1') {
        document.execCommand('formatBlock', false, 'H1');
      } else if (type === 'h2') {
        document.execCommand('formatBlock', false, 'H2');
      }

      handleEditorInput();
    }

    // Link Helper Tooltip methods
    let currentActiveLink = null;

    function getFigmaNodeIdFromUrl(url) {
      if (url.startsWith('figma://node-id=')) {
        return decodeURIComponent(url.substring('figma://node-id='.length));
      }
      try {
        const urlObj = new URL(url);
        return urlObj.searchParams.get('node-id') || '';
      } catch (e) {
        return '';
      }
    }

    function checkLinkClick() {
      const selection = window.getSelection();
      if (!selection.rangeCount) {
        hideLinkTooltip();
        return;
      }
      
      const range = selection.getRangeAt(0);
      let container = range.startContainer;
      
      let anchor = null;
      while (container && container !== editor) {
        if (container.nodeType === Node.ELEMENT_NODE && container.tagName.toLowerCase() === 'a') {
          anchor = container;
          break;
        }
        container = container.parentNode;
      }

      if (anchor) {
        currentActiveLink = anchor;
        const rect = anchor.getBoundingClientRect();
        const editorRect = editor.getBoundingClientRect();
        
        const nodeId = anchor.dataset.nodeId || getFigmaNodeIdFromUrl(anchor.getAttribute('href') || '');
        const url = anchor.getAttribute('href') || '';
        
        const jumpBtn = document.getElementById('tooltipJumpBtn');
        const openBtn = document.getElementById('tooltipOpenBtn');

        if (nodeId) {
          jumpBtn.style.display = 'flex';
          jumpBtn.onclick = (e) => {
            e.stopPropagation();
            parent.postMessage({ pluginMessage: { type: 'goToFrame', nodeId: nodeId } }, '*');
            hideLinkTooltip();
          };
        } else {
          jumpBtn.style.display = 'none';
        }

        openBtn.onclick = (e) => {
          e.stopPropagation();
          if (url && !url.startsWith('#')) {
            window.open(url, '_blank');
          }
          hideLinkTooltip();
        };

        const linkTooltip = document.getElementById('linkTooltip');
        const x = rect.left - editorRect.left + editor.scrollLeft;
        const y = rect.top - editorRect.top + editor.scrollTop - 36;
        
        linkTooltip.style.left = `${Math.min(x, editor.clientWidth - 180)}px`;
        linkTooltip.style.top = `${y}px`;
        linkTooltip.style.display = 'flex';
      } else {
        hideLinkTooltip();
      }
    }

    function hideLinkTooltip() {
      currentActiveLink = null;
      document.getElementById('linkTooltip').style.display = 'none';
    }

    function toggleAttachmentDropdown(event) {
      if (event) event.stopPropagation();
      const dropdown = document.getElementById('attachmentDropdown');
      if (!dropdown) return;
      
      const active = dropdown.style.display === 'flex';
      if (active) {
        closeAttachmentDropdown();
      } else {
        dropdown.style.display = 'flex';
        attachmentDropdownActive = true;
        const searchInput = document.getElementById('attachmentSearch');
        if (searchInput) {
          searchInput.value = '';
          setTimeout(() => searchInput.focus(), 50);
        }
        
        // Request frames
        parent.postMessage({ pluginMessage: { type: 'getFrames' } }, '*');
        
        const closeDropdownOuter = (e) => {
          const btn = document.getElementById('attachmentBtn');
          if (dropdown && !dropdown.contains(e.target) && (!btn || !btn.contains(e.target))) {
            closeAttachmentDropdown();
            document.removeEventListener('click', closeDropdownOuter);
          }
        };
        setTimeout(() => document.addEventListener('click', closeDropdownOuter), 0);
      }
    }

    function closeAttachmentDropdown() {
      const dropdown = document.getElementById('attachmentDropdown');
      if (dropdown) dropdown.style.display = 'none';
      attachmentDropdownActive = false;
    }

    function filterAttachmentFrames(event) {
      const query = event.target.value.toLowerCase().trim();
      renderAttachmentFramesList(query);
    }

    function renderAttachmentFramesList(query = '') {
      const container = document.getElementById('attachmentFramesList');
      if (!container) return;
      
      container.innerHTML = '';
      
      const filtered = allFrames.filter(f => f.name.toLowerCase().includes(query));
      
      if (filtered.length === 0) {
        container.innerHTML = `<div class="attachment-dropdown-empty">No frames found</div>`;
        return;
      }
      
      filtered.forEach(frame => {
        const item = document.createElement('button');
        item.className = 'attachment-dropdown-item';
        item.textContent = frame.name;
        item.onclick = (e) => {
          e.stopPropagation();
          attachNoteToFrame(frame.id, frame.name);
        };
        container.appendChild(item);
      });
    }

    function attachNoteToFrame(frameId, frameName) {
      const activeNote = notes.find(n => n.id === activeNoteId);
      if (!activeNote) return;
      
      parent.postMessage({
        pluginMessage: {
          type: 'attachToFrame',
          frameId: frameId,
          noteId: activeNote.id,
          noteTitle: activeNote.title,
          oldBadgeNodeId: activeNote.badgeNodeId || null
        }
      }, '*');
      
      closeAttachmentDropdown();
    }

    function zoomToAttachedFrame(event) {
      if (event) event.stopPropagation();
      const activeNote = notes.find(n => n.id === activeNoteId);
      if (activeNote && activeNote.attachedFrameId) {
        parent.postMessage({
          pluginMessage: {
            type: 'goToFrame',
            nodeId: activeNote.attachedFrameId
          }
        }, '*');
      }
    }

    function detachFromFrame(event) {
      if (event) event.stopPropagation();
      const activeNote = notes.find(n => n.id === activeNoteId);
      if (activeNote) {
        if (activeNote.badgeNodeId) {
          parent.postMessage({
            pluginMessage: {
              type: 'detachFromFrame',
              badgeNodeId: activeNote.badgeNodeId
            }
          }, '*');
        }
        activeNote.attachedFrameId = null;
        activeNote.attachedFrameName = null;
        activeNote.badgeNodeId = null;
        saveNotesData();
        renderAttachmentWidget();
      }
    }

    // --- TABLE WIZARD LOGIC ---
    function initTableWizard() {
      const grid = document.getElementById('tableWizardGrid');
      if (!grid) return;
      grid.innerHTML = '';
      for (let r = 1; r <= 5; r++) {
        for (let c = 1; c <= 5; c++) {
          const cell = document.createElement('div');
          cell.className = 'table-wizard-cell';
          cell.dataset.row = r;
          cell.dataset.col = c;
          
          cell.addEventListener('mouseover', () => {
            updateTableWizardHighlight(r, c);
          });
          
          cell.addEventListener('click', () => {
            confirmInsertTable(r, c);
          });
          
          grid.appendChild(cell);
        }
      }
    }
    
    function updateTableWizardHighlight(maxR, maxC) {
      document.getElementById('tableWizardSize').textContent = `${maxR} x ${maxC}`;
      document.getElementById('tableWizardRows').value = maxR;
      document.getElementById('tableWizardCols').value = maxC;
      
      const cells = document.querySelectorAll('.table-wizard-cell');
      cells.forEach(cell => {
        const r = parseInt(cell.dataset.row);
        const c = parseInt(cell.dataset.col);
        if (r <= maxR && c <= maxC) {
          cell.classList.add('highlighted');
        } else {
          cell.classList.remove('highlighted');
        }
      });
    }
    
    function toggleTableWizard() {
      const wizard = document.getElementById('tableWizard');
      const tableBtn = document.querySelector('button[title="Insert Table"]');
      if (!wizard || !tableBtn) return;
      
      if (wizard.style.display === 'flex') {
        wizard.style.display = 'none';
      } else {
        wizard.style.display = 'flex';
        
        const btnRect = tableBtn.getBoundingClientRect();
        const containerRect = document.querySelector('.editor-container').getBoundingClientRect();
        
        const leftOffset = (btnRect.left + btnRect.width / 2) - containerRect.left;
        wizard.style.left = `${leftOffset}px`;
        wizard.style.bottom = `${containerRect.bottom - btnRect.top + 8}px`;
        
        updateTableWizardHighlight(3, 2);
        
        const closeWizard = (e) => {
          if (!wizard.contains(e.target) && !tableBtn.contains(e.target)) {
            wizard.style.display = 'none';
            document.removeEventListener('click', closeWizard);
          }
        };
        setTimeout(() => document.addEventListener('click', closeWizard), 0);
      }
    }
    
    function confirmInsertTableCustom() {
      const rowsInput = document.getElementById('tableWizardRows');
      const colsInput = document.getElementById('tableWizardCols');
      const rows = parseInt(rowsInput.value) || 3;
      const cols = parseInt(colsInput.value) || 2;
      confirmInsertTable(rows, cols);
    }
    
    function confirmInsertTable(rows, cols) {
      let html = '<div class="table-container" contenteditable="false">';
      
      // Toolbar
      html += '<div class="table-toolbar">';
      html += '<button class="table-tool-btn" onmousedown="event.preventDefault(); moveTable(this, \'up\')" title="Move Up">⬆️ Move Up</button>';
      html += '<button class="table-tool-btn" onmousedown="event.preventDefault(); moveTable(this, \'down\')" title="Move Down">⬇️ Move Down</button>';
      html += '<button class="table-tool-btn" onmousedown="event.preventDefault(); addTableRow(this)" title="Add Row Below">➕ Row</button>';
      html += '<button class="table-tool-btn" onmousedown="event.preventDefault(); addTableCol(this)" title="Add Column Right">➕ Col</button>';
      html += '<button class="table-tool-btn delete" onmousedown="event.preventDefault(); deleteTable(this)" title="Delete Table">🗑️ Delete</button>';
      html += '</div>';
      
      // Scroll Wrapper
      html += '<div class="table-scroll-wrapper" contenteditable="true">';
      html += '<table class="editor-table">';
      
      // Header row
      html += '<thead><tr>';
      for (let c = 1; c <= cols; c++) {
        html += `<th>Header ${c}</th>`;
      }
      html += '</tr></thead>';
      
      // Body rows
      html += '<tbody>';
      for (let r = 1; r <= rows; r++) {
        html += '<tr>';
        for (let c = 1; c <= cols; c++) {
          html += `<td>Cell ${r}-${c}</td>`;
        }
        html += '</tr>';
      }
      html += '</tbody></table></div></div><p><br></p>';
      
      editor.focus();
      document.execCommand('insertHTML', false, html);
      handleEditorInput();
      
      // Hide wizard
      const wizard = document.getElementById('tableWizard');
      if (wizard) {
        wizard.style.display = 'none';
      }
    }

    function getActiveTableCell(table) {
      const selection = window.getSelection();
      if (!selection.rangeCount) return null;
      let node = selection.getRangeAt(0).commonAncestorContainer;
      while (node && node !== table) {
        if (node.nodeType === Node.ELEMENT_NODE && (node.tagName.toLowerCase() === 'td' || node.tagName.toLowerCase() === 'th')) {
          return node;
        }
        node = node.parentNode;
      }
      return null;
    }

    function moveTable(button, direction) {
      const container = button.closest('.table-container');
      if (!container) return;
      
      if (direction === 'up') {
        const prev = container.previousElementSibling;
        if (prev) {
          container.parentNode.insertBefore(container, prev);
        }
      } else if (direction === 'down') {
        const next = container.nextElementSibling;
        if (next) {
          container.parentNode.insertBefore(container, next.nextSibling);
        }
      }
      handleEditorInput();
    }

    function addTableRow(button) {
      const container = button.closest('.table-container');
      if (!container) return;
      const table = container.querySelector('table');
      if (!table) return;
      
      const activeCell = getActiveTableCell(table);
      const activeRow = activeCell ? activeCell.closest('tr') : null;
      const tbody = table.querySelector('tbody') || table;
      const lastRow = activeRow || tbody.querySelector('tr:last-child') || table.querySelector('tr:last-child');
      const colCount = lastRow ? lastRow.querySelectorAll('th, td').length : 2;
      
      const newRow = document.createElement('tr');
      for (let c = 0; c < colCount; c++) {
        const cell = document.createElement('td');
        cell.innerHTML = '<br>'; // empty editable cell
        newRow.appendChild(cell);
      }
      
      if (lastRow) {
        lastRow.parentNode.insertBefore(newRow, lastRow.nextSibling);
      } else {
        tbody.appendChild(newRow);
      }
      handleEditorInput();
    }

    function addTableCol(button) {
      const container = button.closest('.table-container');
      if (!container) return;
      const table = container.querySelector('table');
      if (!table) return;
      
      const activeCell = getActiveTableCell(table);
      let colIndex = -1;
      if (activeCell) {
        colIndex = Array.prototype.indexOf.call(activeCell.parentNode.children, activeCell);
      }
      
      const rows = table.querySelectorAll('tr');
      rows.forEach((row, r) => {
        const isHeaderRow = row.parentNode.tagName.toLowerCase() === 'thead' || r === 0;
        const newCell = document.createElement(isHeaderRow ? 'th' : 'td');
        newCell.innerHTML = isHeaderRow ? 'Header' : '<br>';
        
        const cells = row.querySelectorAll('th, td');
        if (colIndex >= 0 && colIndex < cells.length) {
          row.insertBefore(newCell, cells[colIndex].nextSibling);
        } else {
          row.appendChild(newCell);
        }
      });
      handleEditorInput();
    }

    function deleteTable(button) {
      const container = button.closest('.table-container');
      if (!container) return;
      if (confirm('Are you sure you want to delete this table?')) {
        container.remove();
        handleEditorInput();
      }
    }


    // Parse links initially when switching/loading content
    const originalLoadActiveNoteContent = loadActiveNoteContent;
    loadActiveNoteContent = function() {
      originalLoadActiveNoteContent();
      renderAttachmentWidget();
      parent.postMessage({ pluginMessage: { type: 'getFrames' } }, '*');
    };

    // Initialize table wizard grid
    initTableWizard();
  </script>
</body>
</html>
